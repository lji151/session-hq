<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="session-hq terminal demo">
<title>session-hq — a session picks up where the last one stopped</title>
<desc>A terminal recording. The HQ status file is injected at session start, so the session begins already knowing what a previous session ruled out. When it stops it is reminded that nothing was written back, and records the outcome for the next one.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;white-space:pre}.dim{fill:#6b7280}.rule{fill:#2f3542}.hdr{fill:#93b4ff;font-weight:700}.ws{fill:#e5e7eb;font-weight:700}.txt{fill:#c3c8d2}.out{fill:#7fd1a5}.you{fill:#ffd479;font-weight:700}.say{fill:#c3c8d2}.warn{fill:#f0a670}.ok{fill:#7fd1a5}.tag{fill:#5b6270;font-size:11px;letter-spacing:.08em}</style>
<rect x="0" y="0" width="900" height="520" rx="10" fill="#12141a"/>
<rect x="0" y="0" width="900" height="30" rx="10" fill="#232733"/>
<rect x="0" y="20" width="900" height="11" fill="#232733"/>
<circle cx="22" cy="15" r="5" fill="#e06c62"/>
<circle cx="40" cy="15" r="5" fill="#e0b562"/>
<circle cx="58" cy="15" r="5" fill="#7fd1a5"/>
<text class="tag" x="418" y="19">session-hq</text>
<text class="dim" x="26" y="68" opacity="0">$ claude<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0200;0.0300;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="rule" x="26" y="87" opacity="0">──────────────────────────────────────────────────────────<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0400;0.0500;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="hdr" x="26" y="106" opacity="0">## session-hq — HQ status for this session<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0520;0.0620;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="dim" x="26" y="125" opacity="0">Domain: apps   ·   HQ root: ~/hq   ·   Last updated 19h ago<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0680;0.0780;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="ws" x="26" y="163" opacity="0">### Payment retry queue<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0880;0.0980;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="txt" x="26" y="182" opacity="0">- Status: retries land, but the dead-letter path drops the error.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1040;0.1140;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="txt" x="26" y="201" opacity="0">- Next: add the error field to DeadLetter.record() at retry.ts:88<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1200;0.1300;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="txt" x="26" y="220" opacity="0">- Blocked on: nothing<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1360;0.1460;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="out" x="26" y="239" opacity="0">- Ruled out: not serialisation — the field is present at enqueue<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1520;0.1620;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="out" x="26" y="258" opacity="0">  and gone after the worker's structuredClone. Diffed both sides.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1680;0.1780;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="txt" x="26" y="277" opacity="0">- Updated: 2026-01-30 (apps)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1840;0.1940;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="rule" x="26" y="296" opacity="0">──────────────────────────────────────────────────────────<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2000;0.2100;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="you" x="26" y="334" opacity="0">&gt; the retry queue thing — pick it up<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2400;0.2500;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="say" x="26" y="372" opacity="0">I have the previous session's finding: the field survives enqueue<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2840;0.2940;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="say" x="26" y="391" opacity="0">and is lost in the worker. That rules out serialisation, so I will<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3040;0.3140;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="say" x="26" y="410" opacity="0">go straight to DeadLetter.record().<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3240;0.3340;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="dim" x="26" y="448" opacity="0">  … 40 minutes of work …<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3720;0.3820;0.4640;0.5040;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="you" x="26" y="68" opacity="0">&gt; thanks, that's it for today<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4960;0.5060;0.8800;0.9200;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="warn" x="26" y="106" opacity="0">  session-hq: this session used 34 tools but status-apps.md is<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5440;0.5540;0.8800;0.9200;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="warn" x="26" y="125" opacity="0">  unchanged. Append what happened — outcome, next step, blockers,<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5640;0.5740;0.8800;0.9200;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="warn" x="26" y="144" opacity="0">  and anything you ruled out — then stop. Negative results matter:<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5840;0.5940;0.8800;0.9200;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="warn" x="26" y="163" opacity="0">  they stop the next session repeating your work.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6040;0.6140;0.8800;0.9200;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="you" x="26" y="201" opacity="0">&gt; /hq-update<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6640;0.6740;0.8800;0.9200;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="say" x="26" y="239" opacity="0">Updated status-apps.md:<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7120;0.7220;0.8800;0.9200;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="ok" x="26" y="258" opacity="0">  - Status: fixed. record() carries the original error; fixture green.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7360;0.7460;0.8800;0.9200;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="ok" x="26" y="277" opacity="0">  - Ruled out: retry backoff was never involved — timings identical<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7600;0.7700;0.8800;0.9200;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="ok" x="26" y="296" opacity="0">    before and after.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7800;0.7900;0.8800;0.9200;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="dim" x="26" y="334" opacity="0">  The next session starts here.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8320;0.8420;0.8800;0.9200;1.0000" dur="25.0s" repeatCount="indefinite" calcMode="linear"/></text>
<text class="tag" x="26" y="504">loops every 25s · no scripts, no network requests</text>
</svg>
